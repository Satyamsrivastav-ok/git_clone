name: Release Watcher

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Print event name
        run: |
          echo "Event: ${{ github.event_name }}"

      - name: Print current date/time
        run: |
          date -u "+%Y-%m-%d %H:%M:%S %Z"

      - name: Watch finished
        run: |
          echo "Release watch complete"
